<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="description" content="BECO — segure a rua. Wave shooter na favela do CRIMINAL TERMINAL.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BECO">
<title>CRIMINAL TERMINAL — BECO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23000'/><text x='8' y='12.5' font-size='12' text-anchor='middle' fill='%2333ff44' font-family='monospace'>$</text></svg>">
<style>
  :root{--phos:#39ff74;--phos-dim:#1c9c3c;--phos-dark:#0a3d18;--amber:#ffb642;--red:#ff5a52}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#000;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none;touch-action:none}
  body{font-family:"Courier New",Courier,monospace;color:var(--phos)}

  /* The play area is one box, sized in JS to the viewport. Everything else —
     readouts, thumb pads — rides on top of it, so the picture never has to give
     up height to a stacked bar. */
  #app{position:fixed;inset:0;background:#000}
  #frame{position:absolute;overflow:hidden;background:#000;
    box-shadow:0 0 0 1px rgba(28,156,60,.35), 0 0 40px rgba(0,0,0,.9)}
  #stage{position:absolute;inset:0;width:100%;height:100%;display:block;
    image-rendering:pixelated;image-rendering:crisp-edges}
  /* CRT dressing, clipped to the picture rather than the page */
  #frame::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 1px,transparent 1px 3px);opacity:.5}
  #frame::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55) 100%)}

  /* ---- readouts, over the picture ---- */
  #hud{position:absolute;z-index:4;left:0;right:0;top:0;pointer-events:none;
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:calc(var(--u)*2);padding:calc(var(--u)*1.4) calc(var(--u)*1.8);
    font-size:calc(var(--u)*2.05);letter-spacing:.12em;line-height:1.1;
    text-shadow:0 0 3px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.8)}
  #hud .side{display:flex;flex-direction:column;gap:calc(var(--u)*.9)}
  #hud .side.r{align-items:flex-end;text-align:right}
  #hud .grp{display:flex;align-items:center;gap:calc(var(--u)*.9);white-space:nowrap}
  #hud b{color:var(--amber);font-weight:normal;font-variant-numeric:tabular-nums}
  #hud .lbl{color:var(--phos-dim)}
  .meter{width:calc(var(--u)*20);height:calc(var(--u)*1.7);border:1px solid rgba(57,255,116,.55);
    background:rgba(0,0,0,.55);overflow:hidden}
  .meter i{display:block;height:100%;width:100%;background:var(--phos);transition:width .12s linear}
  .meter.hurt i{background:var(--red)}
  #magRow{display:flex;gap:1px;height:calc(var(--u)*1.7);align-items:stretch}
  #magRow s{width:calc(var(--u)*.42);min-width:1px;background:var(--amber);text-decoration:none}
  #magRow s.out{background:rgba(255,182,66,.18)}

  /* ---- thumb pads, only where there is a thumb ---- */
  #pads{position:absolute;z-index:5;inset:0;pointer-events:none;display:none}
  .pad{position:absolute;bottom:calc(var(--u)*2.2);pointer-events:auto;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(57,255,116,.5);border-radius:50%;
    background:rgba(4,20,10,.42);color:var(--phos);
    font-family:inherit;font-size:calc(var(--u)*3.2);letter-spacing:.06em;
    width:calc(var(--u)*11);height:calc(var(--u)*11);touch-action:none;
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .pad.on,.pad:active{background:rgba(57,255,116,.85);color:#031007}
  .pad#padL{left:calc(var(--u)*2.2)}
  .pad#padR{left:calc(var(--u)*14.4)}
  .pad#padRe{right:calc(var(--u)*16);width:calc(var(--u)*8.5);height:calc(var(--u)*8.5);
    bottom:calc(var(--u)*1.6);font-size:calc(var(--u)*1.6);border-color:rgba(57,255,116,.4)}
  .pad#padC{right:calc(var(--u)*16);width:calc(var(--u)*8.5);height:calc(var(--u)*8.5);
    bottom:calc(var(--u)*11);font-size:calc(var(--u)*1.6);border-color:rgba(57,255,116,.55)}
  .pad#padF{right:calc(var(--u)*2.2);width:calc(var(--u)*13);height:calc(var(--u)*13);
    bottom:calc(var(--u)*1.8);border-color:rgba(255,182,66,.75);color:var(--amber);
    font-size:calc(var(--u)*2.4)}
  .pad#padF.on,.pad#padF:active{background:rgba(255,182,66,.88);color:#140b00}
  body.touch #pads{display:block}

  /* ---- corner system buttons ---- */
  #sys{position:absolute;z-index:6;right:calc(var(--u)*1.6);bottom:calc(var(--u)*1.4);
    display:flex;gap:calc(var(--u)*1);pointer-events:none}
  /* with thumbs on the bottom corners there is no room down there — go up top,
     in the gap between the two readout stacks */
  body.touch #sys{right:auto;bottom:auto;top:calc(var(--u)*1.2);
    left:50%;transform:translateX(-50%)}
  #sys button{pointer-events:auto;font-family:inherit;font-size:calc(var(--u)*1.9);
    color:var(--phos-dim);background:rgba(0,0,0,.45);border:1px solid rgba(28,156,60,.5);
    border-radius:2px;padding:calc(var(--u)*.5) calc(var(--u)*1.2);cursor:pointer;line-height:1}
  #sys button:hover{color:var(--phos);border-color:var(--phos-dim)}
  #sys button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  #keys{position:absolute;z-index:4;left:calc(var(--u)*1.8);bottom:calc(var(--u)*1.6);
    font-size:calc(var(--u)*1.6);letter-spacing:.1em;color:var(--phos-dim);pointer-events:none;
    text-shadow:0 0 4px rgba(0,0,0,.95);transition:opacity .6s}
  body.touch #keys{display:none}

  /* ---- portrait: this one is landscape only ---- */
  #rotate{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;background:#000;text-align:center;padding:24px}
  #rotate .glyph{font-size:64px;line-height:1;animation:tip 2.4s ease-in-out infinite;color:var(--phos)}
  #rotate h1{font-size:17px;letter-spacing:5px;font-weight:bold}
  #rotate p{font-size:12px;letter-spacing:2px;color:var(--phos-dim);max-width:22em}
  @keyframes tip{0%,42%{transform:rotate(0)}58%,100%{transform:rotate(-90deg)}}
  @media (prefers-reduced-motion: reduce){ #rotate .glyph{animation:none;transform:rotate(-90deg)} }
  body.portrait #rotate{display:flex}
  body.portrait #app{visibility:hidden}
</style>
</head>
<body>

<div id="app">
  <div id="frame">
    <canvas id="stage" width="640" height="340"></canvas>

    <div id="hud">
      <div class="side">
        <span class="grp"><span class="lbl">VIDA</span>
          <span class="meter" id="hpMeter"><i id="hpBar"></i></span></span>
        <span class="grp"><span class="lbl">PENTE</span>
          <span id="magRow"></span> <b id="ammo">30</b></span>
      </div>
      <div class="side r">
        <span class="grp"><span class="lbl">ONDA</span> <b id="wave">1</b></span>
        <span class="grp"><span class="lbl">MORTOS</span> <b id="kills">0</b></span>
        <span class="grp"><span class="lbl">GRANA</span> <b id="score">0</b></span>
      </div>
    </div>

    <div id="pads">
      <button class="pad" id="padL" aria-label="andar para a esquerda">◀</button>
      <button class="pad" id="padR" aria-label="andar para a direita">▶</button>
      <button class="pad" id="padRe" aria-label="recarregar">RECAR</button>
      <button class="pad" id="padC" aria-label="agachar">AGACHA</button>
      <button class="pad" id="padF" aria-label="atirar">FOGO</button>
    </div>

    <div id="keys">← → ANDAR · ↓ AGACHAR · ESPAÇO ATIRAR · R RECARREGAR · P PAUSA</div>
    <div id="sys">
      <button id="sndBtn" type="button">[ SND ]</button>
      <button id="fsBtn" type="button" aria-label="tela cheia">[ ⛶ ]</button>
    </div>
  </div>
</div>

<div id="rotate">
  <div class="glyph">▯</div>
  <h1>GIRE O APARELHO</h1>
  <p>BECO é jogado deitado. Vire o aparelho para a horizontal.</p>
</div>

<script>
/* ============================================================================
   BECO — hold the street.

   A wave shooter built on the same eleven-cel gunman sheet and favela plate the
   rig viewer uses (gunman.html), so everything here inherits that work: the
   figure is drawn at one fixed size in background pixels (50px, about 29 pixels
   to the metre off the parked car), his feet follow the ground curve up the
   hill, and the walk is rigged live by slicing each cel at the crotch and
   driving the two legs out of phase.

   Rivals are the same sheet with the cap and shorts hue-shifted — skin is left
   exactly as drawn; only the clothing changes, which is the read you want at
   50px anyway, since the cap is the one bit of solid colour up top.

   All audio is synthesised at runtime from square waves and filtered noise, the
   same primitives the board game uses. No sound files.
   ========================================================================== */

/* ---------- the sheets, and the figure measured off them ------------------
   Three cycles cut onto one grid by tools/build_gunman_sheets.py: eleven
   planted firing poses, a seven-frame walk and a six-frame crouch-walk. They
   share a cel size, a ground row and an anchor column, so one can replace
   another mid-stride without the character stepping sideways. */
const N_FIRE=11, N_WALK=7, N_CROUCH=6;
const CEL = {IDLE:0, READY:1, RAISE:2, AIM:3, SET:4, FIRE_A:5, FIRE_B:6, VENT:7, LOW_A:8, LOW_B:9, STAND:10};
const ANCHOR_X=192, GROUND_ROW=410, STAND_PX=387, MAN_PX=50;
const S = MAN_PX/STAND_PX;
/* measured off the firing cels: where the flash sits relative to his feet */
const MUZZLE_UP=304*S, MUZZLE_FWD=170*S;
/* how tall he is to a bullet, standing and folded down — this is the whole
   point of the crouch, since a round aimed at a standing chest sails over */
const TALL_STAND=50, TALL_CROUCH=31;
const SOLE=6;                          // rounds this low go into the slabs

/* ---------- the street ---------------------------------------------------- */
const BG_W=2172, BG_H=724, PX_PER_M=29;
const GROUND = [
  [0,615],[560,615],[620,612],[900,611],[1010,606],[1120,606],[1170,596],
  [1300,594],[1330,590],[1360,584],[1540,582],[1570,578],[1600,574],
  [1820,569],[BG_W,569]
];
const WALL = 46;                       // he cannot walk past the ends of the plate
function groundAt(x){
  for(let i=1;i<GROUND.length;i++){
    if(x<=GROUND[i][0]){
      const [x0,y0]=GROUND[i-1],[x1,y1]=GROUND[i];
      return y0+(y1-y0)*(x-x0)/(x1-x0||1);
    }
  }
  return GROUND[GROUND.length-1][1];
}
const HALF_W = 9;                      // half a shoulder, in street pixels

/* ---------- balance ------------------------------------------------------- */
const P_SPEED=46, E_SPEED=31;
const P_HP=100, E_HP=34;
const P_DMG=17,  E_DMG=7;
const MAG=30, RELOAD_MS=1250, P_FIRE_MS=115;
const BULLET_V=1150, DROP_CHANCE=0.34;
const STRIDE=46;      // ground covered per two-step cycle — keeps feet off the ice

const SRC={fire:new Image(), walk:new Image(), crouch:new Image()};
const street=new Image();
let art={}, foe={}, SW=0, SH=0, CEL_W=0, CEL_H=0;

/* Shrinking by repeated halving keeps the figure readable at an eighth of the
   size; one nearest-neighbour step would drop most of his pixels on the floor.
   The brightness lift rides along — the poses were rendered against a dark
   ground and read as murk under a street lamp. */
function shrinkCel(img,sx,sw,sh,dw,dh){
  let c=document.createElement("canvas"); c.width=sw; c.height=sh;
  let g=c.getContext("2d");
  g.imageSmoothingEnabled=true; g.imageSmoothingQuality="high";
  try{ g.filter="brightness(1.12)"; }catch(e){}
  g.drawImage(img,sx,0,sw,sh,0,0,sw,sh);
  while(c.width>dw*2){
    const n=document.createElement("canvas");
    n.width=Math.max(dw,c.width>>1); n.height=Math.max(dh,c.height>>1);
    const ng=n.getContext("2d");
    ng.imageSmoothingEnabled=true; ng.imageSmoothingQuality="high";
    ng.drawImage(c,0,0,n.width,n.height); c=n;
  }
  const out=document.createElement("canvas"); out.width=dw; out.height=dh;
  const og=out.getContext("2d");
  og.imageSmoothingEnabled=true; og.imageSmoothingQuality="high";
  og.drawImage(c,0,0,dw,dh);
  return out;
}
function shrinkSheet(img,n){
  const c=document.createElement("canvas"); c.width=SW*n; c.height=SH;
  const g=c.getContext("2d");
  for(let i=0;i<n;i++) g.drawImage(shrinkCel(img,i*CEL_W,CEL_W,CEL_H,SW,SH),i*SW,0);
  return c;
}
/* Rival colours: the cap is a strong blue and the shorts a desaturated violet,
   and nothing else on the sheets lives in that half of the wheel — skin sits at
   20-40 degrees, the rifle has no chroma at all. So a hue window recolours the
   clothes and leaves the man himself exactly as drawn. */
function recolour(src){
  const c=document.createElement("canvas"); c.width=src.width; c.height=src.height;
  const g=c.getContext("2d"); g.drawImage(src,0,0);
  const im=g.getImageData(0,0,c.width,c.height), d=im.data;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]<8) continue;
    const r=d[i]/255, gg=d[i+1]/255, b=d[i+2]/255;
    const mx=Math.max(r,gg,b), mn=Math.min(r,gg,b), df=mx-mn;
    if(df<0.045) continue;                              // greys: rifle, outlines
    let h;
    if(mx===r) h=60*(((gg-b)/df)%6);
    else if(mx===gg) h=60*((b-r)/df+2);
    else h=60*((r-gg)/df+4);
    if(h<0) h+=360;
    const sat=mx===0?0:df/mx, v=mx;
    let nh=null, ns=sat, nv=v;
    if(h>=190&&h<=260&&sat>0.45){ nh=354; ns=Math.min(1,sat*1.05); }     // cap → red
    else if(h>=290&&h<=350&&sat>0.13){ nh=44; ns=sat*0.85; nv=v*0.92; }  // shorts → khaki
    if(nh===null) continue;
    const cc=nv*ns, hh=nh/60, xx=cc*(1-Math.abs(hh%2-1)), m=nv-cc;
    let R,G,B;
    if(hh<1){R=cc;G=xx;B=0;} else if(hh<2){R=xx;G=cc;B=0;}
    else if(hh<3){R=0;G=cc;B=xx;} else if(hh<4){R=0;G=xx;B=cc;}
    else if(hh<5){R=xx;G=0;B=cc;} else {R=cc;G=0;B=xx;}
    d[i]=(R+m)*255; d[i+1]=(G+m)*255; d[i+2]=(B+m)*255;
  }
  g.putImageData(im,0,0);
  return c;
}
function buildArt(){
  CEL_W=Math.round(SRC.fire.width/N_FIRE); CEL_H=SRC.fire.height;
  SW=Math.round(CEL_W*S); SH=Math.round(CEL_H*S);
  art={fire:shrinkSheet(SRC.fire,N_FIRE), walk:shrinkSheet(SRC.walk,N_WALK),
       crouch:shrinkSheet(SRC.crouch,N_CROUCH)};
  /* rivals never crouch — they have no crouched firing pose to pop up from,
     and a target you cannot shoot back at is not a rival, it is a wall */
  foe={fire:recolour(art.fire), walk:recolour(art.walk), crouch:recolour(art.crouch)};
}

/* ---------- sound --------------------------------------------------------- */
let SND=(function(){try{return localStorage.getItem("ct_snd")!=="off";}catch(e){return true;}})();
let _ac=null;
function ac(){
  if(!_ac) _ac=new (window.AudioContext||window.webkitAudioContext)();
  if(_ac.state==="suspended") _ac.resume();
  return _ac;
}
function tone(f,dur,vol,when,type){
  if(!SND) return;
  try{
    const c=ac(), t=c.currentTime+(when||0);
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||"square"; o.frequency.value=f;
    g.gain.setValueAtTime(vol||.04,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.06));
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+(dur||.06)+.02);
  }catch(e){}
}
function noise(dur,vol,when,cut){
  if(!SND) return;
  try{
    const c=ac(), t=c.currentTime+(when||0);
    const n=Math.max(1,Math.floor(c.sampleRate*(dur||.15)));
    const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=c.createBufferSource(); s.buffer=buf;
    const f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=cut||900;
    const g=c.createGain();
    g.gain.setValueAtTime(vol||.15,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.15));
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); s.stop(t+(dur||.15)+.02);
  }catch(e){}
}
const SFX={
  shot(far){ const a=far?0.42:1;
    noise(.055,.34*a,0,2600); noise(.20,.17*a,.004,760);
    tone(96,.11,.11*a,0,"sine"); noise(.42,.05*a,.06,300); },
  shell(){ tone(2550,.028,.030,.06); tone(3150,.020,.020,.15); },
  step(){ noise(.05,.05,0,420); tone(78,.04,.024,0,"sine"); },
  hit(){ noise(.07,.20,0,520); tone(140,.06,.07,0,"sine"); },
  hurt(){ noise(.10,.26,0,380); tone(110,.14,.09,0,"sine"); tone(78,.22,.06,.06,"sine"); },
  down(){ noise(.16,.22,0,300); tone(150,.12,.06,.02,"sine"); tone(96,.26,.06,.12,"sine"); },
  dry(){ tone(1500,.012,.05); tone(700,.03,.04,.02); },
  reload(){ noise(.05,.10,0,1200); tone(190,.03,.04,.02); noise(.05,.10,.42,1500); tone(240,.04,.05,.46); },
  pickup(){ tone(1245,.05,.045); tone(1568,.10,.05,.06); },
  wave(){ [392,523,659].forEach((f,i)=>tone(f,.13,.05,i*.14)); },
  over(){ [330,262,196,147].forEach((f,i)=>tone(f,.34,.06,i*.3,"sine")); }
};
function toggleSnd(){
  SND=!SND;
  try{ localStorage.setItem("ct_snd",SND?"on":"off"); }catch(e){}
  document.getElementById("sndBtn").textContent=SND?"[ SND ]":"[ MUTE ]";
}

/* ---------- entities ------------------------------------------------------ */
const CALM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const rnd=(a,b)=>a+Math.random()*(b-a);

function makeMan(x,dir,hp){
  return {x, dir, hp, maxHp:hp, ph:0, moving:false, crouch:false, aimT:0, muzzle:0,
          dead:false, fall:0, fade:1, lastFoot:-1, hurtT:0};
}
let P=null, foes=[], shots=[], drops=[], puffs=[];
let wave=1, kills=0, score=0, toSpawn=0, spawnT=0, maxAlive=2;
let state="title", shake=0, flash=0, banner="", bannerT=0;
let firing=false, reloadT=0, fireCd=0, ammo=MAG, moveL=false, moveR=false, crouchIn=false;

function resetGame(){
  P=makeMan(300,1,P_HP);
  foes=[]; shots=[]; drops=[]; puffs=[];
  wave=1; kills=0; score=0; ammo=MAG; reloadT=0; fireCd=0;
  toSpawn=0; spawnT=0; crouchIn=false;
  startWave();
}
function startWave(){
  /* How many come at once matters far more than how many come in total — a
     standing player has to be able to win the opening wave. */
  toSpawn  = 2+Math.floor(wave*0.9);
  maxAlive = Math.min(2+Math.floor(wave/2), 5);
  spawnT   = 1000;
  banner="ONDA "+wave; bannerT=1900;
  SFX.wave();
}
const living = ()=>foes.reduce((n,f)=>n+(f.dead?0:1),0);
function spawnFoe(){
  /* they come in off whichever side has room, just past the edge of the view */
  const W=cv.width, camX=camera();
  const left = Math.random()<0.5;
  let x = left ? camX-40 : camX+W+40;
  x = Math.max(WALL+10, Math.min(BG_W-WALL-10, x));
  const f=makeMan(x, left?1:-1, E_HP+Math.min(26,wave*2));
  f.range=rnd(150,300); f.burst=0; f.speed=E_SPEED*rnd(.85,1.2);
  f.fireT=rnd(900,1600);              // a beat to be seen before he opens up
  foes.push(f);
}

function fireFrom(m,dmg,spread,far){
  shots.push({x:m.x+m.dir*MUZZLE_FWD, y:groundAt(m.x)-MUZZLE_UP+(spread?rnd(-spread,spread):0),
              vx:m.dir*BULLET_V, dmg, foe:m!==P, life:1.6});
  m.muzzle=1; m.aimT=700;
  SFX.shot(far);
  if(m===P){ flash=1; if(!CALM) shake=Math.max(shake,.8); }
}
function damage(m,dmg,dir){
  if(m.dead) return;
  m.hp-=dmg; m.hurtT=140;
  puffs.push({x:m.x+rnd(-4,4), y:groundAt(m.x)-MUZZLE_UP+rnd(-6,6), t:1, vx:dir*18});
  if(m.hp<=0){
    m.dead=true; m.fade=1; m.fall=0;
    if(m===P){ state="over"; SFX.over(); banner="VOCÊ CAIU"; bannerT=1e9; }
    else{
      kills++; score+=100+wave*10; SFX.down();
      if(Math.random()<DROP_CHANCE)
        drops.push({x:m.x, kind:Math.random()<.5?"hp":"ammo", t:0});
    }
  }else{
    SFX.hit();
    if(m===P){ SFX.hurt(); if(!CALM) shake=Math.max(shake,1); }
  }
}

/* ---------- which cel is he on -------------------------------------------
   The walk used to be faked by slicing each cel at the crotch and squashing the
   legs out of phase, because the art had no walk in it. It does now, so the rig
   is gone and the cycles are just played. */
function pose(m){
  if(m.dead) return {s:"fire", c:CEL.VENT};
  if(m.crouch) return {s:"crouch", c:m.moving?Math.floor(m.ph*N_CROUCH)%N_CROUCH:0};
  if(m===P && reloadT>0){
    const k=1-reloadT/RELOAD_MS;
    return {s:"fire", c: k<.2?CEL.LOW_A : k<.4?CEL.LOW_B : k<.7?CEL.STAND : k<.85?CEL.LOW_B : CEL.RAISE};
  }
  if(m.muzzle>0.55) return {s:"fire", c:(Math.random()<.5?CEL.FIRE_A:CEL.FIRE_B)};
  if(m.aimT>0)      return {s:"fire", c:CEL.SET};
  if(m.moving)      return {s:"walk", c:Math.floor(m.ph*N_WALK)%N_WALK};
  return {s:"fire", c:CEL.STAND};
}
/* how tall he is to an incoming round */
const tallOf = m => m.crouch&&!m.dead ? TALL_CROUCH : TALL_STAND;

/* ---------- render -------------------------------------------------------- */
const cv=document.getElementById("stage"), cx=cv.getContext("2d");
cx.imageSmoothingEnabled=false;
function camera(){
  return Math.max(0,Math.min(BG_W-cv.width, Math.round((P?P.x:300)-cv.width*0.5)));
}
function drawMan(m,camX,camY,pal){
  const p=pose(m), src=pal[p.s];
  const feet=groundAt(m.x);
  const dx=Math.round(m.x-camX-ANCHOR_X*S);
  const dy=Math.round(feet-camY-GROUND_ROW*S);

  cx.save();
  cx.globalAlpha=m.fade;
  if(m.dead){                                  /* tip him over onto the slabs */
    cx.translate(m.x-camX, feet-camY);
    cx.rotate(m.dir*m.fall*Math.PI*0.44);
    cx.translate(-(m.x-camX), -(feet-camY));
  }
  if(m.dir<0){ cx.translate(2*dx+2*ANCHOR_X*S,0); cx.scale(-1,1); }
  if(m.hurtT>0){ try{ cx.filter="brightness(2.2) saturate(.4)"; }catch(e){} }
  cx.drawImage(src, p.c*SW,0,SW,SH, dx,dy,SW,SH);
  cx.restore();

  if(m.muzzle>0){                              /* flash, and the light it throws */
    const mx=m.x-camX+m.dir*MUZZLE_FWD, my=feet-camY-MUZZLE_UP;
    const wash=cx.createRadialGradient(mx,my,1,mx,my,86);
    wash.addColorStop(0,"rgba(255,226,150,"+(.34*m.muzzle)+")");
    wash.addColorStop(.4,"rgba(255,150,40,"+(.13*m.muzzle)+")");
    wash.addColorStop(1,"rgba(255,120,0,0)");
    cx.fillStyle=wash; cx.fillRect(mx-90,my-90,180,180);
    const core=cx.createRadialGradient(mx,my,.5,mx,my,15);
    core.addColorStop(0,"rgba(255,255,225,"+(.75*m.muzzle)+")");
    core.addColorStop(1,"rgba(255,190,60,0)");
    cx.fillStyle=core; cx.fillRect(mx-18,my-18,36,36);
  }
}
function drawHealthPip(m,camX,camY){
  if(m.dead||m.hp>=m.maxHp) return;
  const x=Math.round(m.x-camX-11), y=Math.round(groundAt(m.x)-camY-tallOf(m)-9);
  cx.fillStyle="rgba(0,0,0,.6)"; cx.fillRect(x,y,22,3);
  cx.fillStyle="#ff5a52"; cx.fillRect(x,y,Math.round(22*Math.max(0,m.hp/m.maxHp)),3);
}
function render(){
  const W=cv.width,H=cv.height;
  const camX=camera(), camY=BG_H-H;
  const jx=shake?Math.round(rnd(-2.5,2.5)*shake):0, jy=shake?Math.round(rnd(-1.5,1.5)*shake):0;

  cx.save();
  cx.translate(jx,jy);
  cx.drawImage(street,camX,camY,W,H,0,0,W,H);

  drops.forEach(d=>{                            /* crates left on the slabs */
    const x=Math.round(d.x-camX-4), y=Math.round(groundAt(d.x)-camY-8+Math.sin(d.t*4)*1.2);
    cx.fillStyle="rgba(0,0,0,.5)"; cx.fillRect(x-1,y+8,10,2);
    cx.fillStyle=d.kind==="hp"?"#2f7d43":"#7a6428"; cx.fillRect(x,y,8,8);
    cx.fillStyle=d.kind==="hp"?"#7dffa1":"#ffb642";
    if(d.kind==="hp"){ cx.fillRect(x+3,y+1,2,6); cx.fillRect(x+1,y+3,6,2); }
    else cx.fillRect(x+1,y+5,6,2);
  });

  foes.forEach(f=>{ drawMan(f,camX,camY,foe); drawHealthPip(f,camX,camY); });
  if(P) drawMan(P,camX,camY,art);

  cx.strokeStyle="rgba(255,226,160,.85)"; cx.lineWidth=1;
  shots.forEach(s=>{                            /* tracers */
    cx.beginPath();
    cx.moveTo(s.x-camX, s.y-camY);
    cx.lineTo(s.x-camX-Math.sign(s.vx)*7, s.y-camY);
    cx.stroke();
  });
  cx.fillStyle="rgba(255,120,90,.75)";
  puffs.forEach(p=>{ const r=1+3*(1-p.t);
    cx.globalAlpha=p.t; cx.fillRect(p.x-camX-r,p.y-camY-r,r*2,r*2); });
  cx.globalAlpha=1;
  cx.restore();

  if(flash>0){ cx.fillStyle="rgba(255,220,160,"+(0.05*flash)+")"; cx.fillRect(0,0,W,H); }
  if(P&&P.hurtT>0){ cx.fillStyle="rgba(255,40,30,"+(0.30*P.hurtT/140)+")"; cx.fillRect(0,0,W,H); }

  /* off-screen rivals get an arrow, so nothing shoots you from nowhere */
  foes.forEach(f=>{
    if(f.dead) return;
    const sx=f.x-camX;
    if(sx>-6&&sx<W+6) return;
    const x=sx<0?7:W-7, y=Math.round(groundAt(f.x)-camY-MAN_PX*0.6);
    cx.fillStyle="rgba(255,90,82,.9)";
    cx.beginPath();
    cx.moveTo(sx<0?x-5:x+5,y); cx.lineTo(x+(sx<0?4:-4),y-5); cx.lineTo(x+(sx<0?4:-4),y+5);
    cx.closePath(); cx.fill();
  });

  if(bannerT>0||state!=="play"){
    const big = state==="title"?"BECO":state==="over"?"VOCÊ CAIU":state==="paused"?"PAUSA":banner;
    const sub = state==="title" ? "segure a rua · toque ou ESPAÇO"
              : state==="over"  ? "GRANA "+score+" · onda "+wave+" · ESPAÇO p/ recomeçar"
              : state==="paused"? "P para voltar" : "";
    cx.fillStyle="rgba(0,0,0,"+(state==="play"?0.30:0.62)+")";
    cx.fillRect(0,H/2-34,W,state==="play"?32:62);
    cx.textAlign="center";
    cx.fillStyle="#39ff74"; cx.font="bold 20px 'Courier New',monospace";
    cx.fillText(big,W/2,H/2-12);
    if(sub){ cx.fillStyle="#1c9c3c"; cx.font="11px 'Courier New',monospace"; cx.fillText(sub,W/2,H/2+8); }
  }
}

/* ---------- HUD ----------------------------------------------------------- */
const magRow=document.getElementById("magRow");
for(let i=0;i<MAG;i++) magRow.appendChild(document.createElement("s"));
let hudCache={};
function hud(){
  const set=(id,v)=>{ if(hudCache[id]!==v){ hudCache[id]=v; document.getElementById(id).textContent=v; } };
  const hp=P?Math.max(0,P.hp/P_HP):0;
  const bar=document.getElementById("hpBar");
  if(hudCache.hp!==hp){ hudCache.hp=hp; bar.style.width=(hp*100).toFixed(0)+"%"; }
  document.getElementById("hpMeter").classList.toggle("hurt",hp<.34);
  if(hudCache.ammo!==ammo){
    hudCache.ammo=ammo;
    for(let i=0;i<MAG;i++) magRow.children[i].classList.toggle("out",i>=ammo);
  }
  set("ammo",reloadT>0?"··":ammo);
  set("wave",wave); set("kills",kills); set("score",score);
}

/* ---------- input --------------------------------------------------------- */
function startFire(){ if(state==="title"||state==="over"){ begin(); return; } firing=true; }
function beginReload(){
  if(state!=="play"||reloadT>0||ammo===MAG) return;
  reloadT=RELOAD_MS; SFX.reload();
}
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(k==="arrowleft"||k==="a"){ moveL=true; e.preventDefault(); }
  else if(k==="arrowright"||k==="d"){ moveR=true; e.preventDefault(); }
  else if(k==="arrowdown"||k==="s"){ crouchIn=true; e.preventDefault(); }
  else if(k===" "){ e.preventDefault(); ac(); startFire(); }
  else if(k==="r") beginReload();
  else if(k==="p"&&(state==="play"||state==="paused")) state=state==="play"?"paused":"play";
});
addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();
  if(k==="arrowleft"||k==="a") moveL=false;
  else if(k==="arrowright"||k==="d") moveR=false;
  else if(k==="arrowdown"||k==="s") crouchIn=false;
  else if(k===" ") firing=false;
});
function hold(el,down,up){
  const on=e=>{ e.preventDefault(); ac(); el.classList.add("on"); down(); };
  const off=e=>{ e.preventDefault(); el.classList.remove("on"); up&&up(); };
  el.addEventListener("pointerdown",on);
  el.addEventListener("pointerup",off);
  el.addEventListener("pointercancel",off);
  el.addEventListener("pointerleave",off);
}
hold(document.getElementById("padL"),()=>moveL=true,()=>moveL=false);
hold(document.getElementById("padR"),()=>moveR=true,()=>moveR=false);
hold(document.getElementById("padF"),startFire,()=>firing=false);
hold(document.getElementById("padC"),()=>crouchIn=true,()=>crouchIn=false);
document.getElementById("padRe").addEventListener("pointerdown",e=>{e.preventDefault();ac();beginReload();});
cv.addEventListener("pointerdown",e=>{ e.preventDefault(); ac(); startFire(); });
addEventListener("pointerup",()=>firing=false);   // release anywhere lets go of the trigger
addEventListener("blur",()=>{ firing=moveL=moveR=crouchIn=false; });
document.getElementById("sndBtn").onclick=toggleSnd;
function begin(){ resetGame(); state="play"; setTimeout(()=>keysHint.style.opacity=0,9000); }

/* ---------- the loop ------------------------------------------------------ */
let last=performance.now();
function tick(now){
  const dt=Math.min(50,now-last); last=now; const t=dt/1000;
  if(state==="play") step(t,dt);
  else if(P){ P.muzzle=Math.max(0,P.muzzle-t*6); foes.forEach(f=>f.muzzle=Math.max(0,f.muzzle-t*6)); }
  flash=Math.max(0,flash-t*14);
  shake=Math.max(0,shake-t*4);
  if(bannerT>0&&state==="play") bannerT-=dt;
  if(P) P.hurtT=Math.max(0,P.hurtT-dt);
  foes.forEach(f=>f.hurtT=Math.max(0,f.hurtT-dt));
  if(art) render();
  hud();
  requestAnimationFrame(tick);
}

function step(t,dt){
  /* ---- player ---- */
  /* squeezing the trigger stands him up — there is no crouched firing pose,
     and popping up to shoot is the trade the crouch is there to make */
  if(firing) P.crouch=false; else P.crouch=crouchIn&&!P.dead;
  const dirIn=(moveR?1:0)-(moveL?1:0);
  P.moving = dirIn!==0 && !P.dead;
  if(P.moving){
    P.dir=dirIn;
    const v=P_SPEED*(P.crouch?0.55:1);
    P.x=Math.max(WALL,Math.min(BG_W-WALL,P.x+dirIn*v*t));
    /* the cycle is driven by ground covered, not by the clock, so his feet
       never skate — slow him down and he takes slower steps */
    P.ph=(P.ph+v*t/STRIDE)%1;
    const foot=P.ph<0.5?0:1;
    if(foot!==P.lastFoot){ P.lastFoot=foot; SFX.step(); }
  }
  if(reloadT>0){
    reloadT-=dt;
    if(reloadT<=0){ ammo=MAG; reloadT=0; }
  }
  fireCd-=dt;
  if(firing&&fireCd<=0&&reloadT<=0&&!P.dead){
    if(ammo>0){ ammo--; fireFrom(P,P_DMG,0,false); fireCd=P_FIRE_MS; if(ammo%3===0) SFX.shell(); }
    else{ SFX.dry(); fireCd=420; beginReload(); }
  }
  P.aimT=Math.max(0,P.aimT-dt);
  P.muzzle=Math.max(0,P.muzzle-t*7);

  /* ---- rivals ---- */
  spawnT-=dt;
  if(toSpawn>0&&spawnT<=0&&living()<maxAlive){ spawnFoe(); toSpawn--; spawnT=rnd(750,1500); }
  foes.forEach(f=>{
    if(f.dead){ f.fall=Math.min(1,f.fall+t*3.6); f.fade=Math.max(0,f.fade-t*0.16); return; }
    const gap=P.x-f.x, d=Math.abs(gap);
    f.dir=Math.sign(gap)||1;
    f.moving=false;
    if(!P.dead&&d>f.range){
      f.moving=true;
      f.x=Math.max(WALL,Math.min(BG_W-WALL,f.x+f.dir*f.speed*t));
      f.ph=(f.ph+f.speed*t/STRIDE)%1;
    }else if(!P.dead&&d<f.range*0.55){        /* too close — back off a little */
      f.moving=true;
      const v=f.speed*0.7;
      f.x=Math.max(WALL,Math.min(BG_W-WALL,f.x-f.dir*v*t));
      f.ph=(f.ph+v*t/STRIDE)%1;
    }
    f.fireT-=dt;
    if(!P.dead&&f.fireT<=0&&d<520){
      /* aim is loose and gets tighter with the wave; a wide shot sails past */
      fireFrom(f,E_DMG,Math.max(9,34-wave*1.4),d>340);
      f.burst++;
      f.fireT = f.burst>=2+((Math.random()*3)|0) ? (f.burst=0, rnd(1100,2100)/(1+wave*0.05)) : rnd(120,190);
    }
    f.aimT=Math.max(0,f.aimT-dt);
    f.muzzle=Math.max(0,f.muzzle-t*7);
  });
  foes=foes.filter(f=>!(f.dead&&f.fade<=0));

  /* ---- rounds in the air ---- */
  shots.forEach(s=>{
    const nx=s.x+s.vx*t;
    const lo=Math.min(s.x,nx), hi=Math.max(s.x,nx);
    const check=t2=>{
      if(t2.dead||s.hit) return;
      if(t2.x+HALF_W<lo||t2.x-HALF_W>hi) return;
      const feet=groundAt(t2.x);
      if(s.y<feet-tallOf(t2)-2||s.y>feet-SOLE) return;
      s.hit=true; damage(t2,s.dmg,Math.sign(s.vx));
    };
    if(s.foe) check(P); else foes.forEach(check);
    s.x=nx; s.life-=t;
    if(s.x<WALL-30||s.x>BG_W-WALL+30) s.hit=true;
  });
  shots=shots.filter(s=>!s.hit&&s.life>0);

  puffs.forEach(p=>{ p.t-=t*2.6; p.x+=p.vx*t; });
  puffs=puffs.filter(p=>p.t>0);

  /* ---- crates ---- */
  drops.forEach(d=>{
    d.t+=t;
    if(!P.dead&&Math.abs(d.x-P.x)<13){
      d.gone=true; SFX.pickup();
      if(d.kind==="hp") P.hp=Math.min(P_HP,P.hp+28); else ammo=MAG;
      score+=25;
    }
    if(d.t>26) d.gone=true;
  });
  drops=drops.filter(d=>!d.gone);

  /* ---- wave over ---- */
  if(toSpawn===0&&foes.every(f=>f.dead)&&state==="play"){
    score+=250*wave; wave++; startWave();
  }
}

/* ---------- fitting the picture to the screen -----------------------------
   The canvas resolution is derived from the window rather than fixed, so the
   picture fills the frame instead of leaving a band down the side. Two rules
   decide it. The scale is a whole number, because a fractional upscale with
   pixelated rendering draws some pixels two screen-dots wide and others three,
   which crawls horribly once the street starts scrolling. And the canvas is
   then whatever fits at that scale, so a bigger window earns more street and
   more sky rather than bigger pixels. What is left over is at most two dots per
   axis — invisible against a black surround, and a fair price for clean art. */
const app=document.getElementById("app"), frame=document.getElementById("frame");
const keysHint=document.getElementById("keys");
const TOUCH=matchMedia("(pointer: coarse)").matches;
let pausedByRotate=false;
if(TOUCH) document.body.classList.add("touch");

function fit(){
  const vw=Math.max(1,innerWidth), vh=Math.max(1,innerHeight);
  /* BECO is landscape only; on a phone held upright, ask rather than squash */
  const upright = TOUCH && vh>vw*1.02;
  document.body.classList.toggle("portrait",upright);
  /* a phone has no P key, so whatever the rotate card paused, the rotate card
     has to start again */
  if(upright){ if(state==="play"){ state="paused"; pausedByRotate=true; } }
  else if(pausedByRotate){ if(state==="paused") state="play"; pausedByRotate=false; }

  const k=Math.max(1,Math.min(3,Math.round(vh/360)));   // whole-number zoom
  const w=Math.min(BG_W,Math.floor(vw/k)), h=Math.min(BG_H,Math.floor(vh/k));
  if(cv.width!==w||cv.height!==h){
    cv.width=w; cv.height=h;
    cx.imageSmoothingEnabled=false;      // resizing a canvas resets its context
  }
  const bw=w*k, bh=h*k;
  frame.style.width=bw+"px"; frame.style.height=bh+"px";
  frame.style.left=Math.floor((vw-bw)/2)+"px";
  frame.style.top=Math.floor((vh-bh)/2)+"px";
  frame.style.setProperty("--u",(bw/100)+"px");   // one unit = 1% of the picture
}
addEventListener("resize",fit);
addEventListener("orientationchange",()=>setTimeout(fit,120));
if(window.visualViewport) visualViewport.addEventListener("resize",fit);

document.getElementById("fsBtn").addEventListener("click",async()=>{
  try{
    if(document.fullscreenElement||document.webkitFullscreenElement){
      await (document.exitFullscreen?document.exitFullscreen():document.webkitExitFullscreen());
    }else{
      const el=document.documentElement;
      await (el.requestFullscreen?el.requestFullscreen():el.webkitRequestFullscreen());
      /* only Android honours this, and only in fullscreen — the rotate card
         covers everyone else */
      if(screen.orientation&&screen.orientation.lock) screen.orientation.lock("landscape").catch(()=>{});
    }
  }catch(e){}
  setTimeout(fit,120);
});

/* ---------- boot ---------------------------------------------------------- */
let pending=4;
function ready(){
  if(--pending) return;
  buildArt(); fit();
  resetGame(); state="title";
  document.getElementById("sndBtn").textContent=SND?"[ SND ]":"[ MUTE ]";
  requestAnimationFrame(n=>{ last=n; tick(n); });
}
for(const k in SRC) SRC[k].onload=ready;
street.onload=ready;
SRC.fire.src="assets/gunman.png";
SRC.walk.src="assets/gunman-walk.png";
SRC.crouch.src="assets/gunman-crouch.png";
street.src="assets/street.webp";
</script>
</body>
