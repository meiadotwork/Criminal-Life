<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BECO</title>
<meta name="description" content="A favela run-and-gun. Hold the alley, stay standing.">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; background:#05070a; overflow:hidden;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
    touch-action:none; overscroll-behavior:none;
  }
  #wrap { position:fixed; inset:0; display:grid; place-items:center; }
  canvas {
    display:block; image-rendering:auto;
    box-shadow:0 0 0 1px #1b2028, 0 24px 80px -20px #000;
    max-width:100%; max-height:100%;
  }
  #boot {
    position:fixed; inset:0; display:grid; place-items:center;
    background:#05070a; color:#7dd88f; font-size:13px; letter-spacing:.18em;
    z-index:20; transition:opacity .4s;
  }
  #boot.gone { opacity:0; pointer-events:none; }
  #boot .bar { width:220px; height:2px; background:#182028; margin-top:14px; }
  #boot .bar i { display:block; height:100%; width:0; background:#7dd88f; transition:width .2s; }
  #boot .err { color:#ff6b6b; max-width:80vw; text-align:center; line-height:1.7; letter-spacing:.05em; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="boot"><div style="text-align:center">BECO<div class="bar"><i id="bootbar"></i></div></div></div>
<script src="game.js"></script>
</body>
</html>
