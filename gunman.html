<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="CRIMINAL TERMINAL — shooter sprite rig: walks the street and shoots, with synthesised gunfire.">
<meta name="theme-color" content="#010602">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CRIMINAL TERMINAL — SHOOTER</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23000'/><text x='8' y='12.5' font-size='12' text-anchor='middle' fill='%2333ff44' font-family='monospace'>$</text></svg>">
<style>
  :root{--phos:#39ff74;--phos-dim:#1c9c3c;--phos-dark:#0a3d18;--amber:#ffb642;--red:#ff5a52;--bg:#010602}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:
      radial-gradient(ellipse 100% 70% at 50% 42%, rgba(20,90,40,.10) 0%, transparent 70%),
      radial-gradient(ellipse at center, #041206 0%, #010602 78%);
    color:var(--phos);font-family:"Courier New",Courier,monospace;font-size:15px;line-height:1.45;
    text-shadow:0 0 2px rgba(57,255,116,.5),0 0 6px rgba(57,255,116,.18);
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:10px;gap:8px}
  /* scanlines + curvature, same CRT dressing as the game */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);opacity:.55}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:51;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6) 100%)}
  .wrap{width:100%;max-width:840px;display:flex;flex-direction:column;gap:8px}
  .bar{border:1px solid var(--phos-dim);border-radius:2px;padding:6px 12px;display:flex;justify-content:space-between;
    align-items:center;gap:8px;flex-wrap:wrap;
    background:linear-gradient(180deg,rgba(28,156,60,.10),transparent);box-shadow:inset 0 0 12px rgba(57,255,116,.06)}
  .bar h1{font-size:15px;letter-spacing:4px;font-weight:bold;text-shadow:0 0 6px rgba(57,255,116,.6)}
  .bar .sub{font-size:11px;letter-spacing:2px;color:var(--phos-dim)}
  .panel{border:1px solid var(--phos-dim);border-radius:2px;padding:9px;
    background:linear-gradient(180deg,rgba(10,61,24,.12),rgba(1,6,2,.4));box-shadow:inset 0 0 18px rgba(0,0,0,.5)}
  .panel h2{font-size:11px;letter-spacing:3px;border-bottom:1px solid var(--phos-dark);margin-bottom:7px;padding-bottom:4px}
  .panel h2::before{content:"▓ "}
  #stageBox{padding:0;overflow:hidden;position:relative;background:#000}
  canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  button{font-family:inherit;font-size:13px;letter-spacing:1px;color:var(--phos);background:rgba(10,61,24,.18);
    border:1px solid var(--phos-dim);border-radius:2px;padding:6px 11px;cursor:pointer;text-shadow:inherit}
  button:hover{background:rgba(28,156,60,.25)}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  button.sel{background:var(--phos);color:#020a04;text-shadow:none;box-shadow:0 0 10px rgba(57,255,116,.35)}
  button.hot{border-color:var(--amber);color:var(--amber)}
  button.hot.sel{background:var(--amber);color:#140b00;border-color:var(--amber);box-shadow:0 0 10px rgba(255,182,66,.4)}
  label.fld{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:2px;color:var(--phos-dim)}
  input[type=range]{accent-color:var(--phos);width:120px}
  .val{color:var(--phos);min-width:40px;display:inline-block;text-align:right}
  .readout{font-size:11px;letter-spacing:1px;color:var(--phos-dim);display:flex;gap:14px;flex-wrap:wrap}
  .readout b{color:var(--amber);font-weight:normal;font-variant-numeric:tabular-nums}
  .strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
  .strip .cel{flex:0 0 auto;width:52px;border:1px solid var(--phos-dark);border-radius:2px;background:#000;position:relative;cursor:pointer}
  .strip .cel canvas{width:100%}
  .strip .cel.on{border-color:var(--amber);box-shadow:0 0 8px rgba(255,182,66,.4)}
  .strip .cel span{position:absolute;left:2px;top:1px;font-size:9px;color:var(--phos-dim)}
  .note{font-size:11px;color:var(--phos-dim);letter-spacing:1px}
  @media(max-width:560px){.bar h1{font-size:13px;letter-spacing:2px}}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <h1>SHOOTER // SPRITE RIG</h1>
    <span class="sub" id="status">LOADING…</span>
  </div>

  <div class="panel" id="stageBox">
    <canvas id="stage" width="800" height="520"></canvas>
  </div>

  <div class="panel">
    <h2>FIRE CONTROL</h2>
    <div class="row" style="margin-bottom:7px">
      <button id="bIdle" onclick="setMode('idle')">[ IDLE ]</button>
      <button id="bWalk" class="hot" onclick="setMode('walk')">[ WALK ]</button>
      <button id="bWalkfire" class="hot" onclick="setMode('walkfire')">[ WALK + SHOOT ]</button>
    </div>
    <div class="row" style="margin-bottom:7px">
      <button id="bSingle" onclick="setMode('single')">[ SINGLE ]</button>
      <button id="bBurst" onclick="setMode('burst')">[ BURST x3 ]</button>
      <button id="bAuto" onclick="setMode('auto')">[ FULL AUTO ]</button>
    </div>
    <div class="row">
      <button id="bLoop" onclick="toggleLoop()">[ LOOP: ON ]</button>
      <button id="bSnd" onclick="toggleSnd()">[ SND ]</button>
      <label class="fld">SPEED <input type="range" id="spd" min="25" max="200" value="100" oninput="setSpeed(this.value)"><span class="val" id="spdV">1.00x</span></label>
    </div>
    <div class="row" style="margin-top:7px">
      <div class="readout">
        <span>CEL <b id="rFrame">0</b>/11</span>
        <span>POSE <b id="rPose">IDLE</b></span>
        <span>PACED <b id="rDist">0</b>m</span>
        <span>ROUNDS <b id="rShots">0</b></span>
        <span class="note">W=WALK · F=WALK+SHOOT · SPACE=SHOOT · B=BURST · A=AUTO · I=IDLE</span>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>SHEET · 11 CELS</h2>
    <div class="strip" id="strip"></div>
    <div class="note" style="margin-top:6px">assets/gunman.png — 11 × <span id="dims">?</span>px. The walk is rigged live: each cel is cut at the crotch and the two legs are driven separately.</div>
  </div>

</div>

<script>
/* ============================================================================
   SHOOTER — eleven-cel sprite rig for the CRIMINAL TERMINAL gunman.

   Cel order on the sheet:
     0 idle · 1 ready · 2 raise · 3 aim · 4 set
     5 FIRE · 6 FIRE · 7 vent (brass + smoke) · 8-9 lower · 10 idle

   The art is a firing sequence shot front-on — there is no walk cycle in it.
   So the walk is rigged at runtime instead: each cel is sliced at the crotch,
   and the two legs are drawn as separate pieces that squash and slide out of
   phase with each other. A squash rather than a lift keeps the thigh welded to
   the shorts — translating the piece would open a notch in the silhouette.
   Because the rig works off the cut lines alone it applies to any cel, so he
   can walk with the rifle down and walk while firing off the same six poses.

   All audio is synthesised at runtime with the same square-wave / filtered-noise
   primitives the game uses, so the page ships without a single sound file.
   ========================================================================== */

const POSE = ["IDLE","READY","RAISE","AIM","SET","FIRE","FIRE","VENT","LOWER","LOWER","IDLE"];
/* splitX, crotchY per cel — the two cuts the leg rig works from.
   Printed by tools/build_gunman_sheet.py; re-paste it if the art changes. */
const RIG = [
  [123,310],[122,296],[122,299],[117,311],[118,310],[117,290],
  [116,279],[118,289],[123,312],[126,293],[128,307]
];
const FRAMES = RIG.length;
/* barrel tip as a fraction of the cel — drives the bloom that lights the street */
const MUZZLE = {x:0.80, y:0.25};

const sheet = new Image();
let art = sheet;                       // sheet, lifted out of the source art's dusk
let SW=0, SH=0;                        // one cel's size in sheet pixels

/* The poses were rendered against a dark ground and read as murk once they are
   standing under a street lamp. Bake the lift in once at load rather than
   filtering every frame; where canvas filters are unsupported this is a
   straight copy and the art simply stays as drawn. */
function liftArt(){
  try{
    const c=document.createElement("canvas");
    c.width=sheet.width; c.height=sheet.height;
    const g=c.getContext("2d");
    g.imageSmoothingEnabled=false;
    g.filter="brightness(1.12)";
    g.drawImage(sheet,0,0);
    art=c;
  }catch(e){ art=sheet; }
}

/* ---------- sound: square beeper + filtered noise, mirroring the game ------ */
let SND = (function(){ try{ return localStorage.getItem("ct_snd")!=="off"; }catch(e){ return true; } })();
let _ac = null;
function ac(){
  if(!_ac) _ac = new (window.AudioContext||window.webkitAudioContext)();
  if(_ac.state==="suspended") _ac.resume();
  return _ac;
}
function tone(freq,dur,vol,when,type){
  if(!SND) return;
  try{
    const c=ac(), t=c.currentTime+(when||0);
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||"square"; o.frequency.value=freq;
    g.gain.setValueAtTime(vol||.04,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.06));
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+(dur||.06)+.02);
  }catch(e){}
}
function noise(dur,vol,when,cutoff){
  if(!SND) return;
  try{
    const c=ac(), t=c.currentTime+(when||0);
    const n=Math.max(1,Math.floor(c.sampleRate*(dur||.15)));
    const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=c.createBufferSource(); s.buffer=buf;
    const f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=cutoff||900;
    const g=c.createGain();
    g.gain.setValueAtTime(vol||.15,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.15));
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); s.stop(t+(dur||.15)+.02);
  }catch(e){}
}
const SFX = {
  /* rifle: bright crack, body thump, and a tail bouncing off the buildings */
  shot(){ noise(.055,.34,0,2600); noise(.20,.17,.004,760); tone(96,.11,.11,0,"sine"); noise(.42,.05,.06,300); },
  /* brass hitting the pavement a beat after the round leaves */
  shell(){ tone(2550,.028,.030,.06); tone(3150,.020,.020,.15); tone(2250,.018,.014,.23); },
  /* stock coming up to the shoulder / rifle going back down */
  handle(){ noise(.05,.09,0,1300); tone(190,.03,.030,.01); },
  /* bare foot on wet asphalt */
  step(){ noise(.055,.075,0,420); tone(78,.045,.035,0,"sine"); },
  /* dry click when the mag runs out at the end of an auto dump */
  click(){ tone(1500,.012,.05); tone(700,.03,.04,.02); }
};
function toggleSnd(){
  SND=!SND;
  try{ localStorage.setItem("ct_snd",SND?"on":"off"); }catch(e){}
  document.getElementById("bSnd").textContent = SND?"[ SND ]":"[ MUTE ]";
  if(SND) SFX.click();
}

/* ---------- timelines ------------------------------------------------------
   Every step is {f: cel, ms: hold, sfx: cue}. Times are real milliseconds at
   1.00x and get divided by the speed dial.                                   */
const RAISE = [{f:0,ms:80,sfx:"handle"},{f:1,ms:85},{f:2,ms:95},{f:3,ms:105},{f:4,ms:110}];
const LOWER = [{f:4,ms:110},{f:8,ms:95},{f:9,ms:85},{f:10,ms:170,sfx:"handle"},{f:0,ms:420}];
function volley(n,gap){
  const out=[];
  for(let i=0;i<n;i++){
    out.push({f:i%2?6:5, ms:gap*0.45, sfx:"shot"});
    out.push({f:4,       ms:gap*0.55, sfx:i===n-1?"shell":null});
  }
  return out;
}
const SEQ = {
  idle    : [{f:10,ms:1600},{f:0,ms:1600}],
  single  : [].concat(RAISE,[{f:5,ms:65,sfx:"shot"},{f:7,ms:150,sfx:"shell"}],LOWER),
  burst   : [].concat(RAISE,volley(3,115),[{f:7,ms:190,sfx:"shell"}],LOWER),
  auto    : [].concat(RAISE,volley(18,96),[{f:7,ms:200,sfx:"click"}],LOWER),
  /* walking cels hold still — the legs are driven by the walk phase, not the
     timeline, so a single cel is all these two modes need from it */
  walk    : [{f:0,ms:1e9}],
  walkfire: [].concat([{f:3,ms:180},{f:4,ms:170}],volley(6,150),[{f:7,ms:260,sfx:"shell"},{f:4,ms:220},{f:3,ms:200}])
};
const WALKING = {walk:1, walkfire:1};

let mode="idle", loop=true, speed=1;
let seq=SEQ.idle, step=0, stepT=0, cur=0, shots=0;
let flash=0, shake=0;
let walkPh=0, scrollX=0, metres=0, lastFoot=-1;
/* recoil kick is the one gratuitous bit of motion — hold the camera still for
   anyone who asked the OS for less of it */
const CALM = matchMedia("(prefers-reduced-motion: reduce)").matches;

function setMode(m){
  if(!SEQ[m]) return;
  ac();                                  // first tap unlocks audio on mobile
  mode=m; seq=SEQ[m]; step=0; stepT=0; cur=seq[0].f; shots=0;
  document.getElementById("rShots").textContent=0;
  fire(seq[0].sfx);
  [["idle","bIdle"],["walk","bWalk"],["walkfire","bWalkfire"],
   ["single","bSingle"],["burst","bBurst"],["auto","bAuto"]].forEach(([k,id])=>{
    document.getElementById(id).classList.toggle("sel",k===m);
  });
}
function toggleLoop(){
  loop=!loop;
  document.getElementById("bLoop").textContent="[ LOOP: "+(loop?"ON":"OFF")+" ]";
}
function setSpeed(v){
  speed=Math.max(.25,v/100);
  document.getElementById("spdV").textContent=speed.toFixed(2)+"x";
}
function fire(cue){
  if(!cue) return;
  SFX[cue] && SFX[cue]();
  if(cue==="shot"){ flash=1; shake=CALM?0:1; shots++; document.getElementById("rShots").textContent=shots; }
}

/* ---------- the walk -------------------------------------------------------
   One cycle is two steps. Each leg squashes toward the hip on its own half of
   the cycle, which lifts the foot without detaching the thigh, and slides
   forward as it goes. The body rides up on whichever leg is mid-swing.        */
function gait(){
  const a=Math.sin(walkPh*Math.PI*2), b=-a;
  const lift=v=>Math.max(0,v);
  return {
    sL:1-0.13*lift(a), dxL:9*lift(a),
    sR:1-0.13*lift(b), dxR:9*lift(b),
    bob:-3.6*Math.abs(a)
  };
}

/* ---------- the street ------------------------------------------------------
   Layers scroll at their own rate against the walk. Everything is placed off a
   hash of the tile index so the city stays put as it slides by.               */
function hash(n){ n=(n<<13)^n; return ((n*(n*n*15731+789221)+1376312589)&0x7fffffff)/0x7fffffff; }

const cv=document.getElementById("stage"), cx=cv.getContext("2d");
cx.imageSmoothingEnabled=false;

function band(y0,h,tile,rate,paint){
  const W=cv.width, off=scrollX*rate, first=Math.floor(off/tile)-1;
  for(let i=first;i*tile-off<W+tile;i++) paint(i, Math.round(i*tile-off), y0, h);
}

function drawStreet(ground){
  const W=cv.width, H=cv.height;
  const base=ground-58;                  // where the buildings meet the pavement
  const sky=cx.createLinearGradient(0,0,0,base);
  sky.addColorStop(0,"#050a11"); sky.addColorStop(.62,"#0b1621"); sky.addColorStop(1,"#16222b");
  cx.fillStyle=sky; cx.fillRect(0,0,W,base);

  /* far skyline */
  band(0,0,96,0.22,(i,x)=>{
    const h=100+hash(i*7+1)*140;
    cx.fillStyle="#080f18"; cx.fillRect(x,base-h,94,h);
  });
  /* tenement row, close enough for lit windows */
  band(0,0,148,0.5,(i,x)=>{
    const h=190+hash(i*13+5)*150;
    cx.fillStyle="#040910"; cx.fillRect(x,base-h,144,h);
    for(let r=0;r<7;r++) for(let c=0;c<4;c++){
      const s=hash(i*97+r*11+c);
      if(s<0.44) continue;
      cx.fillStyle= s>0.87 ? "rgba(255,196,110,.34)" : "rgba(255,182,66,.13)";
      cx.fillRect(x+16+c*32, base-h+18+r*26, 12, 15);
    }
  });

  /* pavement he walks on: a lit far edge, then slabs sliding past underfoot */
  cx.fillStyle="#10171b"; cx.fillRect(0,base,W,H-base);
  cx.fillStyle="#1b262b"; cx.fillRect(0,base,W,5);
  band(0,0,78,1,(i,x)=>{
    cx.fillStyle="rgba(150,175,190,.055)"; cx.fillRect(x,base+5,2,H-base);
  });
  cx.fillStyle="rgba(0,0,0,.30)"; cx.fillRect(0,ground+20,W,H-ground-20);

  /* street lamps, and the pool each one throws down onto the slabs */
  band(0,0,300,0.8,(i,x)=>{
    const pool=cx.createRadialGradient(x,base+12,6,x,base+12,235);
    pool.addColorStop(0,"rgba(255,214,140,.20)"); pool.addColorStop(1,"rgba(255,214,140,0)");
    cx.fillStyle=pool; cx.fillRect(x-235,base-190,470,H-base+190);
    cx.fillStyle="#0c141a"; cx.fillRect(x-3,base-186,6,186);
    cx.fillStyle="#0c141a"; cx.fillRect(x-3,base-190,26,5);
    cx.fillStyle="rgba(255,222,155,.75)"; cx.fillRect(x+14,base-186,12,7);
  });
}

function render(){
  if(!SW) return;
  const W=cv.width, H=cv.height, ground=H-34;
  cx.clearRect(0,0,W,H);
  drawStreet(ground);

  const g=WALKING[mode] ? gait() : {sL:1,dxL:0,sR:1,dxR:0,bob:0};
  const kick = shake ? (Math.random()*2-1)*4*shake : 0;
  const dx=Math.round(W*0.30 + kick), dy=Math.round(ground-SH+g.bob+(shake?(Math.random()*2-1)*2*shake:0));

  if(flash>0){                            /* wide wash across the asphalt */
    const mx=dx+SW*MUZZLE.x, my=dy+SH*MUZZLE.y;
    const wash=cx.createRadialGradient(mx,my,2,mx,my,300);
    wash.addColorStop(0,"rgba(255,226,150,"+(.5*flash)+")");
    wash.addColorStop(.35,"rgba(255,150,40,"+(.18*flash)+")");
    wash.addColorStop(1,"rgba(255,120,0,0)");
    cx.fillStyle=wash; cx.fillRect(0,0,W,H);
  }

  const sx=RIG[cur][0], cy=RIG[cur][1], legH=SH-cy;
  if(WALKING[mode]){
    cx.drawImage(art, cur*SW,0, SW,cy, dx,dy, SW,cy);
    cx.drawImage(art, cur*SW,cy, sx,legH,
                 dx+g.dxL, dy+cy, sx, Math.max(1,Math.round(legH*g.sL)));
    cx.drawImage(art, cur*SW+sx,cy, SW-sx,legH,
                 dx+sx+g.dxR, dy+cy, SW-sx, Math.max(1,Math.round(legH*g.sR)));
  }else{
    cx.drawImage(art, cur*SW,0,SW,SH, dx,dy,SW,SH);
  }

  if(flash>0){                            /* tighter flash core on top */
    const mx=dx+SW*MUZZLE.x, my=dy+SH*MUZZLE.y;
    const core=cx.createRadialGradient(mx,my,1,mx,my,58);
    core.addColorStop(0,"rgba(255,255,225,"+(.7*flash)+")");
    core.addColorStop(1,"rgba(255,190,60,0)");
    cx.fillStyle=core; cx.fillRect(mx-76,my-76,152,152);
  }
}

/* ---------- clock --------------------------------------------------------- */
let last=performance.now();
function tick(now){
  const dt=Math.min(64,now-last); last=now;

  if(WALKING[mode]){
    walkPh=(walkPh+dt*speed/840)%1;
    scrollX+=dt*speed*0.115;
    metres+=dt*speed*0.00115;
    const foot=walkPh<0.5?0:1;           // a step lands as each half begins
    if(foot!==lastFoot){ lastFoot=foot; SFX.step(); }
    document.getElementById("rDist").textContent=metres.toFixed(0);
  }

  stepT+=dt*speed;
  let guard=0;
  while(stepT>=seq[step].ms && guard++<40){
    stepT-=seq[step].ms;
    step++;
    if(step>=seq.length){
      step=0;
      if(mode!=="idle" && !loop){ setMode("idle"); break; }
      if(mode!=="idle"){ shots=0; document.getElementById("rShots").textContent=0; }
    }
    cur=seq[step].f;
    fire(seq[step].sfx);
  }

  flash=Math.max(0,flash-dt/70);
  shake=Math.max(0,shake-dt/90);

  render();
  document.getElementById("rFrame").textContent=cur;
  document.getElementById("rPose").textContent=POSE[cur];
  document.querySelectorAll("#strip .cel").forEach((c,i)=>c.classList.toggle("on",i===cur));
  requestAnimationFrame(tick);
}

/* ---------- cel strip ----------------------------------------------------- */
function buildStrip(){
  const strip=document.getElementById("strip");
  for(let i=0;i<FRAMES;i++){
    const d=document.createElement("div"); d.className="cel"; d.title=POSE[i];
    const c=document.createElement("canvas");
    c.width=SW; c.height=SH;
    const g=c.getContext("2d"); g.imageSmoothingEnabled=false;
    g.drawImage(art,i*SW,0,SW,SH,0,0,SW,SH);
    const tag=document.createElement("span"); tag.textContent=i;
    d.appendChild(c); d.appendChild(tag);
    d.onclick=()=>{ mode="idle"; seq=[{f:i,ms:1e9}]; step=0; stepT=0; cur=i; };
    strip.appendChild(d);
  }
}

addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(k===" "||k==="enter"){ e.preventDefault(); setMode("single"); }
  else if(k==="w") setMode("walk");
  else if(k==="f") setMode("walkfire");
  else if(k==="b") setMode("burst");
  else if(k==="a") setMode("auto");
  else if(k==="i") setMode("idle");
});
cv.addEventListener("click",()=>setMode(mode==="walk"?"walkfire":mode==="idle"?"walk":mode));

sheet.onload=()=>{
  SW=Math.round(sheet.width/FRAMES); SH=sheet.height;
  liftArt();
  document.getElementById("dims").textContent=SW+"×"+SH;
  document.getElementById("status").textContent="READY — 11 CELS";
  buildStrip();
  setMode("walkfire");
  document.getElementById("bSnd").textContent=SND?"[ SND ]":"[ MUTE ]";
  requestAnimationFrame(t=>{ last=t; tick(t); });
};
sheet.onerror=()=>{ document.getElementById("status").textContent="ASSET MISSING: assets/gunman.png"; };
sheet.src="assets/gunman.png";
</script>
</body>
</html>
